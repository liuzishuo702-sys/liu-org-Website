<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="OUR MC">
    <title>OUR MC</title>
    <style>
        :root {
            --bg-overlay: rgba(30, 30, 30, 0.2);
            --bg-overlay-hover: rgba(40, 40, 40, 0.35);
            --border-light: 1px solid rgba(255, 255, 255, 0.12);
            --border-solid-white: 1px solid rgba(255, 255, 255);
            --blur-strong: blur(24px) saturate(180%);
            --blur-medium: blur(22px) saturate(170%);
            --blur-light: blur(12px);
            --shadow-white-glow: 0 0 12px rgba(255,255,255);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3);
            --inner-highlight: inset 0 1px 0 rgba(255,255,255,0.08);
            --inner-white: inset 0 0 6px rgba(255,255,255);
            --transition-base: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            color: #fff;
            background-color: #000;
            line-height: 1.6;
            padding-top: 80px;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }
        body::before{
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("./image/background.jpg");
            background-size: cover;      /* 图片铺满屏幕 */
            background-position: center; /* 图片居中 */
            background-repeat: no-repeat;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -1; /* 放到最底层，不会盖住页面文字按钮 */
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 顶部导航 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(40, 40, 40, 0.25);
            backdrop-filter: var(--blur-strong);
            -webkit-backdrop-filter: var(--blur-strong);
            border-bottom: var(--border-light);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), var(--inner-highlight);
        }
        .navbar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            gap: 20px;
        }
        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: var(--transition-base);
        }
        .logo-img:hover {
            transform: scale(1.05);
            filter: drop-shadow(var(--shadow-white-glow));
        }
        .nav-container {
            display: flex;
            flex: 1;
            justify-content: center;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-links a {
            color: #eee;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 6px 14px;
            border: var(--border-solid-white);
            border-radius: 99px;
            transition: var(--transition-base);
            white-space: nowrap;
        }
        .nav-links a:hover {
            color: #fff;
            box-shadow: 0 0 8px rgba(255,255,255), 0 0 18px rgba(255,255,255), var(--inner-white);
            text-shadow: 0 0 10px rgba(255,255,255);
            transform: translateY(-2px);
        }
        .mobile-menu-btn, .mobile-bottom-nav { display: none; }

        /* 登录按钮 */
        .login-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: var(--blur-light);
            -webkit-backdrop-filter: var(--blur-light);
            color: #fff;
            border: var(--border-solid-white);
            border-radius: 99px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition-base);
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            font-size: 0.95rem;
            box-shadow: var(--inner-highlight);
        }
        .login-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            box-shadow: 0 0 10px rgba(255,255,255),0 0 24px rgba(255,255,255), var(--inner-white);
            transform: translateY(-3px) scale(1.05);
        }

        /* 视频头部容器 */
        .hero-video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            margin-top: 0;
            padding-top: 80px;
        }
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
        }
        /* 底部渐变过渡遮罩 */
        .hero-video-container::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 1) 100%
            );
            z-index: 2;
            pointer-events: none;
        }
        .carousel-title {
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            z-index: 15;
            font-size: 8rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .explore-btn {
            position: absolute;
            left: 50%;
            top: 65%;
            transform: translate(-50%, -50%);
            z-index: 15;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            background: var(--bg-overlay);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: var(--border-solid-white);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-base);
            box-shadow: var(--shadow-card), var(--inner-highlight);
        }
        .explore-btn:hover {
            background: var(--bg-overlay-hover);
            box-shadow: 0 0 20px rgba(255,255,255), var(--shadow-card), var(--inner-highlight);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* 内容区块 */
        .section {
            padding: 80px 0;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 600;
            color: #fff;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .card {
            background: var(--bg-overlay);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: var(--border-solid-white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-card), var(--inner-highlight);
            transition: transform var(--transition-base), background var(--transition-base);
        }
        .card:hover {
            transform: translateY(-8px);
            background: var(--bg-overlay-hover);
            box-shadow: 0 0 20px rgba(255,255,255), var(--shadow-card), var(--inner-highlight);
        }
        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #fff;
        }
        .card p {
            color: #ccc;
        }
        .more-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: var(--bg-overlay);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: var(--border-solid-white);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-base);
            box-shadow: var(--inner-highlight);
        }
        .more-btn:hover {
            background: var(--bg-overlay-hover);
            box-shadow: 0 0 12px rgba(255,255,255), var(--inner-highlight);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .social-icons img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            transition: var(--transition-base);
            filter: drop-shadow(0 0 10px rgba(255,255,255));
        }
        .social-icons img:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 16px rgba(255,255,255));
        }
        /* 页脚 */
        footer {
            background: rgba(15,15,15,0.4);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: var(--border-solid-white);
            padding: 40px 0;
            text-align: center;
            margin-top: 80px;
        }
        footer p {
            color: #999;
            line-height: 1.8;
        }

        /* 响应式 */
        @media (max-width: 992px) {
            .nav-links { gap: 15px; }
            .social-icons img { width: 60px; height: 60px; }
            .explore-btn { padding: 12px 28px; font-size: 1rem; }
            .carousel-title { font-size: 2.2rem; }
        }
        @media (max-width: 768px) {
            body {
                padding-top: 58px;
                padding-bottom: calc(64px + env(safe-area-inset-bottom));
                background: #080912;
            }
            header { background: rgba(8, 9, 18, 0.88); }
            .container { padding: 0 16px; }
            .navbar { height: 58px; padding: 8px 0; flex-wrap: nowrap; gap: 12px; }
            .logo-img { height: 32px; max-width: 120px; }
            .nav-container { display: none; }
            .login-btn { margin-left: auto; padding: 6px 13px; font-size: 0.8rem; }
            .mobile-menu-btn {
                display: inline-flex;
                width: 36px;
                height: 36px;
                align-items: center;
                justify-content: center;
                color: #fff;
                background: transparent;
                border: 1px solid rgba(255,255,255,.35);
                border-radius: 10px;
                font-size: 1.25rem;
                cursor: pointer;
            }
            header.menu-open .nav-container {
                display: block;
                position: absolute;
                top: 58px;
                left: 0;
                right: 0;
                padding: 10px 16px 14px;
                background: rgba(8,9,18,.96);
                border-bottom: var(--border-light);
            }
            header.menu-open .nav-links {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            header.menu-open .nav-links a {
                display: block;
                padding: 9px 10px;
                font-size: .82rem;
                text-align: center;
            }
            .cards { grid-template-columns: 1fr; }
            .hero-video-container {
                height: calc(100svh - 58px);
                min-height: 520px;
                padding-top: 0;
            }
            .carousel-title {
                width: 90%;
                text-align: center;
                font-size: clamp(1.5rem, 7vw, 2.2rem);
                top: 53%;
                white-space: normal;
                line-height: 1.25;
            }
            .explore-btn {
                padding: 10px 24px;
                font-size: .9rem;
                top: 72%;
                border-radius: 999px;
            }
            .section { padding: 54px 0; }
            .section-title { font-size: 1.45rem; margin-bottom: 24px; }
            .card { padding: 22px; border-radius: 12px; }
            .social-icons { gap: 25px; }
            .social-icons img { width: 50px; height: 50px; }

            .mobile-bottom-nav {
                position: fixed;
                z-index: 120;
                display: flex;
                left: 0;
                right: 0;
                bottom: 0;
                height: 64px;
                padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
                background: rgba(16,17,28,.94);
                backdrop-filter: blur(18px);
                border-top: 1px solid rgba(255,255,255,.14);
                justify-content: space-around;
            }
            .mobile-bottom-nav a {
                flex: 1;
                color: #aeb2c2;
                text-decoration: none;
                font-size: .68rem;
                text-align: center;
                display: flex;
                flex-direction: column;
                gap: 2px;
                align-items: center;
                justify-content: center;
            }
            .mobile-bottom-nav a span {
                font-size: 1.15rem;
                line-height: 1;
            }
            .mobile-bottom-nav a.active,
            .mobile-bottom-nav a:hover {
                color: #fff;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../index.html">
                <img src="../image/minecraft_logo.svg" alt="OUR MC Logo" class="logo-img">
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="打开菜单">&#9776;</button>
            <div class="nav-container">
                <ul class="nav-links">
                    <li><a href="#home">首页</a></li>
                    <li><a href="#how-develop">网站开发</a></li>
                    <li><a href="#public-resources">公共资源</a></li>
                    <li><a href="../page/introduce_developer.html">了解此网站的开发者</a></li>
                    <li><a href="#video">我们的社交媒体</a></li>
                </ul>
            </div>
            <a href="../page/login.html" class="login-btn">登录</a>
        </div>
    </header>
    <nav class="mobile-bottom-nav" aria-label="移动端底部导航">
        <a href="#home" class="active"><span>⌂</span>首页</a>
        <a href="#public-resources"><span>▦</span>资源</a>
        <a href="#minecraft"><span>◈</span>服务器</a>
        <a href="#video"><span>◎</span>社交</a>
    </nav>

    <section id="home" class="hero-video-container">
        <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="../image/video-poster.jpg">
            <source src="../image/vidio/minecraft-ad-vidio.mp4" type="video/mp4">
            你的浏览器不支持HTML5视频
        </video>
        <div class="carousel-title">OUR Minecraft欢迎您！</div>
        <a href="#how-develop" class="explore-btn">开始探索</a>
    </section>

    <section id="how-develop" class="section">
        <div class="container">
            <h2 class="section-title">什么是Our Minecraft？</h2>
            <p style="text-align: center; max-width: 800px; margin: 0 auto; color: #ccc; font-size: 1.1rem;">
                Our Minecraft服务器为“腐竹HSdianZD”所有，不归属本网站，如想要加入，请点击“了解更多”
            </p>
            <div style="text-align: center; margin-top: 30px;">
                <a href="https://www.our-mc.cn/" target="_blank" rel="noopener noreferrer" class="more-btn">了解更多</a>
            </div>
        </div>
    </section>

    <section id="public-resources" class="section">
        <div class="container">
            <h2 class="section-title">骚扰腐竹</h2>
            <div class="cards">
                <div class="card">
                    <h3>腐竹联系方式</h3>
                    <p>QQ:3877364376</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>如果对此网站有任何问题，请在法定节假日期间向“Liusicheng20120802@outlook.com”发邮件。</p>
        </div>
    </footer>

    <script>
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (!targetElement) return;
                targetElement.scrollIntoView({ behavior: 'smooth' });
            });
        });

        // 移动端菜单开关
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const headerDom = document.querySelector('header');
        mobileMenuBtn.addEventListener('click', () => {
            headerDom.classList.toggle('menu-open');
        });

        // 移动端底部导航点击激活
        const mobileNavLinks = document.querySelectorAll('.mobile-bottom-nav a');
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileNavLinks.forEach(item => item.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // 滚动监听：根据滚动位置自动高亮底部导航
        const sections = document.querySelectorAll("section[id]");
        window.addEventListener("scroll", () => {
            let current = "";
            sections.forEach((section) => {
                const sectionTop = section.offsetTop;
                if(window.scrollY >= sectionTop - 200){
                    current = section.getAttribute("id");
                }
            });
            mobileNavLinks.forEach((link) => {
                link.classList.remove("active");
                if(link.getAttribute("href") === `#${current}`){
                    link.classList.add("active");
                }
            })
        })
    </script>
</body>
</html>
